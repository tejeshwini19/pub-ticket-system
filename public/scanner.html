<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Bunker Pub Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:#101010;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:650px;
background:#1b1b1b;
border-radius:20px;
padding:25px;
box-shadow:0 0 35px rgba(0,0,0,.5);

}

h1{

text-align:center;
color:#ffcc00;
margin-bottom:8px;
font-size:34px;

}

.subtitle{

text-align:center;
color:#cccccc;
margin-bottom:25px;
font-size:15px;

}

#reader{

width:100%;
overflow:hidden;
border-radius:18px;
border:4px solid #ffcc00;
background:white;

}

#result{

margin-top:20px;
text-align:center;
font-size:22px;
font-weight:bold;

}

.card{

display:none;
margin-top:25px;
background:#242424;
padding:25px;
border-radius:15px;
border-left:6px solid #ffcc00;

}

.card h2{

text-align:center;
margin-bottom:20px;

}

.row{

display:flex;
justify-content:space-between;
padding:15px;
margin-bottom:12px;
background:#333;
border-radius:10px;

}

.label{

color:#ffcc00;
font-weight:bold;

}

.value{

color:white;
font-weight:600;

}

.valid{

color:#00ff88;

}

.used{

color:#ff4444;

}

.invalid{

color:#ff4444;

}

@media(max-width:700px){

.container{

padding:15px;

}

h1{

font-size:28px;

}

.row{

flex-direction:column;
gap:6px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>🍺 THE BUNKER PUB</h1>

<div class="subtitle">
Official Ticket Scanner
</div>

<div id="reader" style="width:100%;max-width:500px;margin:25px auto;"></div>



<div class="card" id="ticketCard">

<h2 id="status"></h2>

<div class="row">
<div class="label">Customer Name</div>
<div class="value" id="name"></div>
</div>

<div class="row">
<div class="label">Phone Number</div>
<div class="value" id="phone"></div>
</div>

<div class="row">
<div class="label">Ticket Count</div>
<div class="value" id="count"></div>
</div>

<div class="row">
<div class="label">Ticket ID</div>
<div class="value" id="ticketId"></div>
</div>

</div>

<script src="scanner.js"></script>

</body>

</html>
