<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>   Pub Entry Pass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

            background:#111;

        }

        .card{

            width:650px;

            max-width:100%;

            background:#1b1b1b;

            border-radius:25px;

            overflow:hidden;

            box-shadow:0 25px 60px rgba(0,0,0,.35);

            animation:fade .5s ease;
            border:2px solid #ffcc00;

        }

        @keyframes fade{

            from{

                opacity:0;

                transform:translateY(25px);

            }

            to{

                opacity:1;

                transform:translateY(0);

            }

        }

        .header{

            background:#ffcc00;

            color:#111;

            text-align:center;

            padding:35px;

        }

        .header h1{

            font-size:42px;

            font-weight:700;

            letter-spacing:1px;

            text-shadow:0 2px 8px rgba(255,255,255,.2);

        }

        .header p{

            margin-top:10px;

            font-size:16px;

            opacity:.95;

        }

        .content{

           padding:35px;
        background:#1b1b1b;

        }

        #ticketHeading{

            text-align:center;

            font-size:38px;

            font-weight:bold;

            margin-bottom:35px;

        }

        .info{

            display:flex;

            justify-content:space-between;

            align-items:center;

            background:#2b2b2b;

            padding:18px 22px;

            margin-bottom:18px;

            border-radius:15px;

            
           border-left:6px solid #ffcc00;

            transition:.25s;

        }

        .info:hover{

            background:#333;

            transform:translateY(-2px);

            box-shadow:0 8px 20px rgba(0,0,0,.08);

        }

        .label{

            color:#ffcc00;

            font-weight:600;

            font-size:17px;

        }

        .value{

            color:white;

            font-size:18px;

            font-weight:bold;

        }

        .footer{

            background:#1b1b1b;

            text-align:center;

            padding:25px;

            border-top:1px solid #eee;

        }

        .footer h2{

            color:#ffcc00;

            margin-bottom:8px;

        }

        .footer p{

            color:#ccc;

            font-size:14px;

        }

        @media(max-width:650px){

            body{

                padding:15px;

            }

            .header h1{

                font-size:32px;

            }

            #ticketHeading{

                font-size:30px;

            }

            .info{

                flex-direction:column;

                align-items:flex-start;

                gap:8px;

            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="header">

        <h1>🎟  THE BUNKER PUB ENTRY PASS</h1>

        <p>One-Time Secure QR Verification</p>

    </div>

    <div class="content">

        <h2 id="ticketHeading">

            Loading...

        </h2>

        <div class="info">

            <div class="label">

                👤 Customer Name

            </div>

            <div class="value" id="name"></div>

        </div>

        <div class="info">

            <div class="label">

                📱 Phone Number

            </div>

            <div class="value" id="phone"></div>

        </div>

        <div class="info">

            <div class="label">

                🆔 Ticket ID

            </div>

            <div class="value" id="ticketId"></div>

        </div>

        <div class="info">

            <div class="label">

                🎟 Number of Tickets

            </div>

            <div class="value" id="count"></div>

        </div>

    </div>

    <div class="footer">

        <h2>🔒 VERIFIED BY PUB SECURITY</h2>

        <p>One-Time QR Verification • Authorized Entry Only</p>

    </div>

</div>

<script src="/ticket.js"></script>

</body>

</html>
